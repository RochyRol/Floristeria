services:
  postgres:
    image: postgres:16-alpine
    container_name: decoimperio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: decoimperio
      POSTGRES_PASSWORD: decoimperio_secret
      POSTGRES_DB: decoimperio_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decoimperio -d decoimperio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: decoimperio_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@decoimperio.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
